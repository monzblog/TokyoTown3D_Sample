<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tokyo City Drive</title>
  <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; }
    #map { width: 100vw; height: 100vh; }
    #ui {
      position: fixed;
      top: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(6px);
      color: #fff;
      font: 14px/1.5 'Segoe UI', sans-serif;
      padding: 7px 20px;
      border-radius: 24px;
      pointer-events: none;
      white-space: nowrap;
    }
    #cities {
      position: fixed;
      top: 50%;
      left: 14px;
      transform: translateY(-50%);
      background: rgba(0,0,0,.58);
      backdrop-filter: blur(6px);
      color: #fff;
      font: 13px/1.5 'Segoe UI', sans-serif;
      padding: 8px 6px;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      gap: 2px;
      max-height: 90vh;
      overflow-y: auto;
    }
    #cities .sec {
      font-size: 10px;
      color: #aaa;
      text-align: center;
      margin: 5px 2px 2px;
      letter-spacing: 0.5px;
      pointer-events: none;
    }
    #cities button {
      background: rgba(255,255,255,0.1);
      border: none;
      color: #fff;
      padding: 4px 12px;
      border-radius: 8px;
      cursor: pointer;
      font: inherit;
      white-space: nowrap;
      transition: background 0.15s;
    }
    #cities button:hover  { background: rgba(255,255,255,0.25); }
    #cities button.active { background: rgba(100,160,255,0.45); }
  </style>
</head>
<body>

<div id="map"></div>
<div id="cities"></div>
<div id="ui">
  🚗 Tokyo City Drive — ドラッグで移動 · スクロールでズーム · 右ドラッグで視点調整
  <span style="pointer-events:auto; margin-left:18px; white-space:nowrap;">
    交通量
    <input type="range" id="traffic" min="0" max="3000" value="800"
           style="vertical-align:middle; width:90px; margin:0 6px; cursor:pointer;">
    <span id="trafficVal">800</span> 台
  </span>
</div>

<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ─── 場所：東京駅周辺 ────────────────────────────────
const CENTER_LNG = 139.7671;
const CENTER_LAT = 35.6812;

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty',
  center: [CENTER_LNG, CENTER_LAT],
  zoom: 16.5,
  pitch: 55,
  bearing: -17,
  antialias: true
});

map.on('load', () => {
  // ラベル（テキスト）レイヤーの手前に建物を挿入
  let firstLabelId;
  for (const layer of map.getStyle().layers) {
    if (layer.type === 'symbol' && layer.layout?.['text-field']) {
      firstLabelId = layer.id;
      break;
    }
  }

  // 3D 建物 (OpenMapTiles スキーマ)
  map.addLayer({
    id: '3d-buildings',
    source: 'openmaptiles',
    'source-layer': 'building',
    type: 'fill-extrusion',
    minzoom: 14,
    paint: {
      'fill-extrusion-color': [
        'interpolate', ['linear'],
        ['coalesce', ['get', 'render_height'], 8],
          0,  '#d4c9b0',
         30,  '#b0a898',
        100,  '#888880',
        250,  '#66645e'
      ],
      'fill-extrusion-height': ['coalesce', ['get', 'render_height'], 8],
      'fill-extrusion-base':   ['coalesce', ['get', 'render_min_height'], 0],
      'fill-extrusion-opacity': 0.88
    }
  }, firstLabelId);

  setupCarLayer();
});

// ─── Three.js 車レイヤー ──────────────────────────────

// マップ原点（東京駅）のメルカトル座標
const originMercator = maplibregl.MercatorCoordinate.fromLngLat(
  [CENTER_LNG, CENTER_LAT], 0
);
// 1メートル → メルカトル単位の変換係数
const SCALE = originMercator.meterInMercatorCoordinateUnits();

const CAR_COLORS = [
  0xdd2222, 0x2244cc, 0x22aa33, 0xdd9900,
  0xcc22cc, 0x11aacc, 0xddcc00, 0xff6600,
  0xaa2255, 0x226699, 0x66aa22, 0xdd4400,
];

function makeCar(color) {
  const g     = new THREE.Group();
  const body  = new THREE.MeshLambertMaterial({ color });
  const dark  = new THREE.MeshLambertMaterial({ color: 0x111111 });
  const glass = new THREE.MeshLambertMaterial({ color: 0x88aacc, transparent: true, opacity: 0.6 });
  const lamp  = new THREE.MeshBasicMaterial({ color: 0xffffaa });

  // ボディ
  const bodyM = new THREE.Mesh(new THREE.BoxGeometry(4, 1.1, 2), body);
  bodyM.position.y = 0.85;
  g.add(bodyM);

  // キャビン
  const cabin = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.0, 1.72), body);
  cabin.position.set(-0.35, 1.85, 0);
  g.add(cabin);

  // ガラス
  const win = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.72, 1.73), glass);
  win.position.set(-0.35, 1.85, 0);
  g.add(win);

  // ヘッドライト
  for (const z of [0.68, -0.68]) {
    const hl = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.28, 0.22), lamp);
    hl.position.set(2.05, 0.85, z);
    g.add(hl);
  }

  // ホイール
  const wg = new THREE.CylinderGeometry(0.4, 0.4, 0.3, 10);
  for (const [wx, wy, wz] of [
    [1.3, 0.4, 0.9], [1.3, 0.4, -0.9],
    [-1.3, 0.4, 0.9], [-1.3, 0.4, -0.9]
  ]) {
    const w = new THREE.Mesh(wg, dark);
    w.rotation.z = Math.PI / 2;
    w.position.set(wx, wy, wz);
    g.add(w);
  }

  return g;
}

function setupCarLayer() {
  const scene  = new THREE.Scene();
  const camera = new THREE.Camera();

  scene.add(new THREE.AmbientLight(0xffffff, 0.75));
  const sun = new THREE.DirectionalLight(0xffffff, 0.85);
  sun.position.set(100, 200, 50);
  scene.add(sun);

  // ─── 座標変換 ──────────────────────────────────────
  // ローカル座標系：東京駅を原点とするメートル単位
  //   +x = 東、−x = 西、+z = 南、−z = 北

  function lngLatToLocal(lng, lat) {
    const mc = maplibregl.MercatorCoordinate.fromLngLat([lng, lat], 0);
    return {
      x: (mc.x - originMercator.x) / SCALE,
      z: (mc.y - originMercator.y) / SCALE
    };
  }

  function buildPath(coords) {
    const pts = coords.map(([lng, lat]) => lngLatToLocal(lng, lat));
    let cum = 0;
    const segs = [];
    for (let i = 0; i < pts.length - 1; i++) {
      const dx = pts[i+1].x - pts[i].x, dz = pts[i+1].z - pts[i].z;
      const len = Math.hypot(dx, dz);
      segs.push({ p0: pts[i], p1: pts[i+1], len, cum });
      cum += len;
    }
    return { segs, total: cum };
  }

  function pathAt(path, t) {
    const dist = ((t % path.total) + path.total) % path.total;
    let s = path.segs[0];
    for (const seg of path.segs) {
      if (seg.cum <= dist) s = seg; else break;
    }
    const u = s.len > 0 ? Math.min((dist - s.cum) / s.len, 1) : 0;
    return {
      x:  s.p0.x + (s.p1.x - s.p0.x) * u,
      z:  s.p0.z + (s.p1.z - s.p0.z) * u,
      tx: s.len > 0 ? (s.p1.x - s.p0.x) / s.len : 1,
      tz: s.len > 0 ? (s.p1.z - s.p0.z) / s.len : 0
    };
  }

  // 決定論的乱数（リセット可能）
  const SEED = 0xbeef1234;
  let _rs = SEED;
  function rnd() {
    _rs ^= _rs << 13; _rs ^= _rs >> 17; _rs ^= _rs << 5;
    return (_rs >>> 0) / 0x100000000;
  }
  function resetRnd() { _rs = SEED; }

  const CAR_SPEED = 5;
  const LANE_OFF  = 2.5;
  let maxCars = 800;

  const carData = [];
  let colorIdx = 0;
  let roadPaths = null; // 一度構築したら使いまわす

  // ─── タイルから道路経路を構築 ─────────────────────────
  function buildRoadPaths() {
    const features = map.querySourceFeatures('openmaptiles', {
      sourceLayer: 'transportation',
      filter: ['in', 'class',
        'motorway', 'trunk', 'primary', 'secondary',
        'tertiary', 'residential', 'service'
      ]
    });
    const seen = new Set();
    const paths = [];
    for (const f of features) {
      if (f.geometry.type !== 'LineString') continue;
      const key = f.id != null ? String(f.id)
                               : f.geometry.coordinates.map(c => c.join(',')).join('|');
      if (seen.has(key)) continue;
      seen.add(key);
      const path = buildPath(f.geometry.coordinates);
      if (path.total < 30) continue;
      paths.push(path);
    }
    resetRnd();
    paths.sort(() => rnd() - 0.5);
    return paths;
  }

  // ─── 車の配置（交通量変更時も呼ぶ） ─────────────────────
  function spawnCarsOnRoads() {
    for (const c of carData) scene.remove(c.mesh);
    carData.length = 0;
    colorIdx = 0;

    if (!roadPaths) roadPaths = buildRoadPaths();

    resetRnd();
    for (const path of roadPaths) {
      if (carData.length >= maxCars) break;
      const perDir = Math.max(1, Math.min(3, Math.floor(path.total / 80)));
      for (const dir of [1, -1]) {
        for (let i = 0; i < perDir && carData.length < maxCars; i++) {
          const mesh  = makeCar(CAR_COLORS[colorIdx++ % CAR_COLORS.length]);
          const speed = (CAR_SPEED + rnd() * 3) * dir;
          scene.add(mesh);
          carData.push({ mesh, path, t: rnd() * path.total, speed, fading: 0, opacity: 1 });
        }
      }
    }
  }

  // ─── 交通量スライダー ─────────────────────────────────
  const sliderEl = document.getElementById('traffic');
  const valEl    = document.getElementById('trafficVal');
  sliderEl.addEventListener('input', () => {
    maxCars = parseInt(sliderEl.value);
    valEl.textContent = maxCars;
    spawnCarsOnRoads();
  });

  // ─── WebGL レンダラー（MapLibre のキャンバスを共有）──
  let renderer;

  const customLayer = {
    id: '3d-cars',
    type: 'custom',
    renderingMode: '3d',

    onAdd(map, gl) {
      renderer = new THREE.WebGLRenderer({
        canvas: map.getCanvas(),
        context: gl,
        antialias: true
      });
      renderer.autoClear = false;
    },

    render(gl, args) {
      const rawMatrix = (args instanceof Float32Array || Array.isArray(args))
        ? args : args?.defaultProjectionData?.mainMatrix;
      if (!rawMatrix) return;

      const rotX = new THREE.Matrix4().makeRotationAxis(
        new THREE.Vector3(1, 0, 0), Math.PI / 2
      );
      const m = new THREE.Matrix4().fromArray(rawMatrix);
      const l = new THREE.Matrix4()
        .makeTranslation(originMercator.x, originMercator.y, originMercator.z)
        .scale(new THREE.Vector3(SCALE, -SCALE, SCALE))
        .multiply(rotX);

      camera.projectionMatrix = m.multiply(l);
      renderer.resetState();
      renderer.render(scene, camera);
      map.triggerRepaint();
    }
  };

  map.addLayer(customLayer);
  map.once('idle', spawnCarsOnRoads);

  // マップ移動後にタイルが読み込まれたら道路を再取得して再スポーン
  let moveTimer = null;
  map.on('moveend', () => {
    clearTimeout(moveTimer);
    moveTimer = setTimeout(() => {
      map.once('idle', () => {
        roadPaths = null;
        spawnCarsOnRoads();
      });
    }, 300);
  });

  // ─── 都市ボタン ───────────────────────────────────────
  const CITIES = [
    { sec: '🗾 日本' },
    { name: '東京',   lng: 139.7671, lat: 35.6812 },
    { name: '横浜',   lng: 139.6380, lat: 35.4437 },
    { name: '大阪',   lng: 135.5023, lat: 34.6937 },
    { name: '京都',   lng: 135.7681, lat: 35.0116 },
    { name: '神戸',   lng: 135.1955, lat: 34.6901 },
    { name: '名古屋', lng: 136.9066, lat: 35.1815 },
    { name: '広島',   lng: 132.4553, lat: 34.3853 },
    { name: '福岡',   lng: 130.4017, lat: 33.5902 },
    { name: '仙台',   lng: 140.8694, lat: 38.2688 },
    { name: '札幌',   lng: 141.3544, lat: 43.0621 },
    { sec: '🌍 世界' },
    { name: 'New York',  lng:  -74.0060, lat:  40.7128 },
    { name: 'London',    lng:   -0.1276, lat:  51.5074 },
    { name: 'Paris',     lng:    2.3522, lat:  48.8566 },
    { name: 'Dubai',     lng:   55.2708, lat:  25.2048 },
    { name: 'Singapore', lng:  103.8198, lat:   1.3521 },
    { name: 'Sydney',    lng:  151.2093, lat: -33.8688 },
  ];

  const cityPanel = document.getElementById('cities');
  let activeBtn = null;

  for (const c of CITIES) {
    if (c.sec) {
      const d = document.createElement('div');
      d.className = 'sec';
      d.textContent = c.sec;
      cityPanel.appendChild(d);
    } else {
      const btn = document.createElement('button');
      btn.textContent = c.name;
      btn.addEventListener('click', () => {
        if (activeBtn) activeBtn.classList.remove('active');
        btn.classList.add('active');
        activeBtn = btn;
        map.flyTo({ center: [c.lng, c.lat], zoom: 16.5, pitch: 55, bearing: -17, duration: 2000 });
      });
      cityPanel.appendChild(btn);
      if (c.name === '東京') { btn.classList.add('active'); activeBtn = btn; }
    }
  }

  // ─── アニメーションループ ────────────────────────────
  const clock = new THREE.Clock();
  const FADE_DUR = 0.4;

  function setOpacity(group, opacity) {
    group.traverse(obj => {
      if (obj.isMesh) {
        obj.material.transparent = opacity < 1;
        obj.material.opacity = opacity;
      }
    });
  }

  (function animate() {
    requestAnimationFrame(animate);
    const dt = Math.min(clock.getDelta(), 0.1);

    for (const c of carData) {
      // フェードアウト中：透明になったら別経路へ移動してフェードイン開始
      if (c.fading === 1) {
        c.opacity = Math.max(0, c.opacity - dt / FADE_DUR);
        setOpacity(c.mesh, c.opacity);
        if (c.opacity <= 0) {
          const idx = Math.floor(Math.random() * roadPaths.length);
          c.path = roadPaths[idx];
          c.t    = c.speed > 0 ? 0 : c.path.total;
          c.fading = 2;
        }
        continue;
      }

      // フェードイン中
      if (c.fading === 2) {
        c.opacity = Math.min(1, c.opacity + dt / FADE_DUR);
        setOpacity(c.mesh, c.opacity);
        if (c.opacity >= 1) c.fading = 0;
      }

      // 移動
      c.t += c.speed * dt;

      // 経路の終端に達したらフェードアウト開始
      const done = c.speed > 0 ? c.t >= c.path.total : c.t < 0;
      if (done && c.fading === 0 && roadPaths.length > 0) {
        c.t = c.speed > 0 ? c.path.total : 0;
        c.fading = 1;
        c.opacity = 1;
      }

      const { x, z, tx, tz } = pathAt(c.path, c.t);
      const dir = c.speed > 0 ? 1 : -1;

      c.mesh.position.set(
        x - tz * dir * LANE_OFF,
        0,
        z + tx * dir * LANE_OFF
      );
      c.mesh.rotation.y = Math.atan2(-tz * dir, tx * dir);
    }
  })();
}
</script>
</body>
</html>
